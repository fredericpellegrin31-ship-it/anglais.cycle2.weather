<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Mode "mots" : si un mot n'a pas d'image (partie enseignant), on affiche le mot écrit en anglais -->
    <script>
    (function () {
        function escapeXml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function wrapLines(text) {
            var words = text.split(/\s+/).filter(Boolean);
            if (words.length <= 1) return words.length ? words : [''];
            var lines = [], cur = '';
            words.forEach(function (w) {
                if (cur && (cur + ' ' + w).length > 12) { lines.push(cur); cur = w; }
                else { cur = cur ? cur + ' ' + w : w; }
            });
            if (cur) lines.push(cur);
            return lines.slice(0, 4);
        }
        // Génère une "image" (SVG en data-URI) contenant le mot anglais écrit
        window.makeWordCardImage = function (text) {
            var lines = wrapLines(String(text || '').trim());
            var longest = Math.max.apply(null, lines.map(function (l) { return l.length; }).concat([1]));
            var size = Math.max(34, Math.min(120, Math.floor(340 / (longest * 0.58))));
            var lineH = size * 1.15;
            var startY = 200 - ((lines.length - 1) * lineH) / 2;
            var tspans = lines.map(function (l, i) {
                return '<text x="200" y="' + (startY + i * lineH) + '" text-anchor="middle" dominant-baseline="central" ' +
                    'font-family="Segoe UI, Tahoma, Arial, sans-serif" font-weight="800" font-size="' + size + '" fill="#1e293b">' +
                    escapeXml(l) + '</text>';
            }).join('');
            var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">' +
                '<rect x="8" y="8" width="384" height="384" rx="48" fill="#ffffff" stroke="#fdba74" stroke-width="10"/>' +
                tspans + '</svg>';
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        };
        function hasImage(w) {
            return [w.image, w.img, w.picture, w.src].some(function (v) { return typeof v === 'string' && v.trim() !== ''; });
        }
        // Applique le mode "mots" à tous les thèmes enregistrés (sans modifier le stockage)
        window.withTextFallback = function (themes) {
            if (!Array.isArray(themes)) return themes;
            themes.forEach(function (t) {
                if (!t || !Array.isArray(t.words)) return;
                t.words.forEach(function (w) {
                    if (w && !hasImage(w)) {
                        var label = w.en || w.speech || w.fr || '';
                        if (label) w.image = window.makeWordCardImage(label);
                    }
                });
            });
            return themes;
        };
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        #quit-btn { position: fixed; top: 14px; left: 14px; z-index: 1000; background: rgba(0,0,0,.75); color: white; border: 2px solid white; border-radius: 10px; padding: 9px 14px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.35); font-family: sans-serif; }
        #quit-btn:hover { background: rgba(0,0,0,.9); }
    </style>
</head>
<body class="pt-16">
    <!-- En-tete standard VOCABPLAY -->
    <header class="fixed top-0 left-0 right-0 z-[1000] bg-white shadow-md p-3 md:p-4 flex justify-between items-center border-t-4 border-[#012169]">
<button onclick="goBack()" class="px-3 py-1.5 md:px-4 md:py-2 rounded-lg font-bold transition-colors bg-slate-200 text-slate-700 hover:bg-slate-300 text-xs sm:text-sm md:text-base flex items-center gap-2">
            🏠 Menu Principal
        </button>
    </header>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Configuration des icônes Lucide pour React
        const Home = () => <i data-lucide="home"></i>;
        const Play = () => <i data-lucide="play"></i>;
        const BookOpen = () => <i data-lucide="book-open"></i>;
        const RefreshCw = () => <i data-lucide="refresh-cw"></i>;
        const Volume2 = ({ size }) => <i data-lucide="volume-2" style={{width: size, height: size}}></i>;
        const CheckCircle = () => <i data-lucide="check-circle" className="text-green-600"></i>;
        const HelpCircle = () => <i data-lucide="help-circle" className="text-orange-600"></i>;
        const XCircle = () => <i data-lucide="x-circle" className="text-red-600"></i>;

        // ==========================================
        // THÈME DE VOCABULAIRE DYNAMIQUE (lié à index.html)
        // ==========================================
        const COLOR_PALETTE = [
            "bg-orange-100 border-orange-400",
            "bg-blue-100 border-blue-400",
            "bg-pink-100 border-pink-400",
            "bg-red-100 border-red-400",
            "bg-yellow-100 border-yellow-400",
            "bg-amber-100 border-amber-400",
            "bg-green-100 border-green-400",
            "bg-cyan-100 border-cyan-400",
            "bg-purple-100 border-purple-400",
            "bg-teal-100 border-teal-400",
            "bg-lime-100 border-lime-400",
            "bg-rose-100 border-rose-400"
        ];

        const isImageUrl = (val) => typeof val === 'string' && (val.includes('.') || val.startsWith('http') || val.startsWith('data:'));

        function loadThemeData() {
            const urlParams = new URLSearchParams(window.location.search);
            const themeId = urlParams.get('themeId');
            const savedThemes = withTextFallback(JSON.parse(localStorage.getItem('app_vocab_themes')) || []);

            let theme = null;
            if (themeId) theme = savedThemes.find(t => t.id === themeId || t.id == themeId);

            // Fallback si aucun thème n'est trouvé
            if (!theme) {
                theme = {
                    name: "Weather",
                    words: [
                        { id: 'sunny', en: "It's sunny", speech: "It's sunny", image: 'sunny.png' },
                        { id: 'cloudy', en: "It's cloudy", speech: "It's cloudy", image: 'cloudy.png' },
                        { id: 'foggy', en: "It's foggy", speech: "It's foggy", image: 'foggy.png' },
                        { id: 'raining', en: "It's raining", speech: "It's raining", image: 'raining.png' },
                        { id: 'snowing', en: "It's snowing", speech: "It's snowing", image: 'snowing.png' },
                        { id: 'stormy', en: "It's stormy", speech: "It's stormy", image: 'stormy.png' },
                        { id: 'windy', en: "It's windy", speech: "It's windy", image: 'windy.png' }
                    ]
                };
            }

            let rawWords = Array.isArray(theme.words) ? theme.words : [];

            // Application des filtres enseignant (mots sélectionnés)
            if (Array.isArray(theme.selectedWordIds) && theme.selectedWordIds.length > 0) {
                rawWords = rawWords.filter(w => theme.selectedWordIds.includes(w.id));
            } else if (Array.isArray(theme.selectedWords) && typeof theme.selectedWords[0] === 'string') {
                rawWords = rawWords.filter(w => theme.selectedWords.includes(w.id));
            } else {
                const hasFlags = rawWords.some(w => w.selected !== undefined || w.active !== undefined);
                if (hasFlags) rawWords = rawWords.filter(w => w.selected !== false && w.active !== false);
            }

            const vocabulary = rawWords.map((word, index) => {
                const text = word.speech || word.en || word.target || word.word || word.fr || '';
                const image = word.image || word.img || word.picture || word.src || '';
                return {
                    id: word.id || text || ('word_' + index),
                    text: text,
                    image: image,
                    color: COLOR_PALETTE[index % COLOR_PALETTE.length]
                };
            });

            return { id: theme.id || null, name: theme.name || 'Vocabulaire', vocabulary };
        }

        const THEME = loadThemeData();
        document.title = `${THEME.name} - Quiz`;

        function goBack() {
            window.speechSynthesis.cancel();
            const themeParam = THEME.id ? `?themeId=${THEME.id}` : '';
            window.location.href = `index.html${themeParam}`;
        }

        // Affiche soit une image (fichier/URL), soit un emoji de secours
        const WordVisual = ({ item, className }) => {
            if (isImageUrl(item.image)) {
                return <img src={item.image} alt={item.text} className={className} />;
            }
            return <span className={`flex items-center justify-center ${className}`} style={{fontSize: '3rem', lineHeight: 1}}>{item.image}</span>;
        };

        const FoodApp = () => {
            const [view, setView] = useState('menu'); 
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [quizQueue, setQuizQueue] = useState([]); 
            const [currentOptions, setCurrentOptions] = useState([]); 
            const [feedback, setFeedback] = useState(null); 
            const [voices, setVoices] = useState([]);
            const [errorTracker, setErrorTracker] = useState({});

            // Vocabulaire issu du thème choisi dans index.html
            const vocabulary = THEME.vocabulary;

            useEffect(() => {
                const loadVoices = () => {
                    const availableVoices = window.speechSynthesis.getVoices();
                    setVoices(availableVoices);
                };
                loadVoices();
                window.speechSynthesis.onvoiceschanged = loadVoices;
                // Initialiser les icônes lucide après le rendu
                if (window.lucide) window.lucide.createIcons();
            }, [view, feedback, currentOptions]);

            const speak = (text) => {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                
                // Recherche d'une voix anglaise de qualité
                const englishVoice = voices.find(v => v.lang === 'en-US' || v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en'));
                
                if (englishVoice) utterance.voice = englishVoice;
                utterance.lang = 'en-GB'; 
                utterance.rate = 0.9; 
                utterance.pitch = 1;
                window.speechSynthesis.speak(utterance);
            };

            const shuffleArray = (array) => {
                const newArr = [...array];
                for (let i = newArr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
                }
                return newArr;
            };

            // Toutes les images du thème sont proposées à chaque question.
            // L'ordre est mélangé une seule fois au début de chaque partie (voir startQuiz)
            // puis reste identique jusqu'à la fin de la partie.

            // Mise en page adaptée au nombre de mots du thème
            const nbOptions = vocabulary.length;
            const optionsLayout = nbOptions <= 4
                ? { wrap: 'max-w-lg', cols: 'grid-cols-2', card: 'h-40 p-4', img: 'h-28' }
                : nbOptions <= 9
                    ? { wrap: 'max-w-2xl', cols: 'grid-cols-3', card: 'h-32 p-3', img: 'h-24' }
                    : { wrap: 'max-w-4xl', cols: 'grid-cols-3 sm:grid-cols-4', card: 'h-28 p-2', img: 'h-20' };

            const startQuiz = () => {
                setCurrentQuestionIndex(0);
                setFeedback(null);
                const initialErrors = {};
                vocabulary.forEach(word => initialErrors[word.id] = 0);
                setErrorTracker(initialErrors);

                const queue = shuffleArray([...vocabulary, ...vocabulary]);
                setQuizQueue(queue);
                setCurrentOptions(shuffleArray(vocabulary)); // nouvel ordre des cartes à chaque nouvelle partie
                setView('quiz');

                setTimeout(() => speak(queue[0].text), 600);
            };

            const nextStep = () => {
                if (currentQuestionIndex + 1 < quizQueue.length) {
                    const nextIdx = currentQuestionIndex + 1;
                    const nextQuestion = quizQueue[nextIdx];
                    setCurrentQuestionIndex(nextIdx);
                    setFeedback(null);
                    setTimeout(() => speak(nextQuestion.text), 500);
                } else {
                    setView('results');
                }
            };

            const handleAnswer = (selectedItem) => {
                if (feedback) return;
                const currentQuestion = quizQueue[currentQuestionIndex];
                const isCorrect = selectedItem.id === currentQuestion.id;

                if (isCorrect) {
                    setFeedback({ status: 'correct', id: selectedItem.id });
                    speak("Great job!"); 
                    setTimeout(nextStep, 1200);
                } else {
                    setFeedback({ status: 'incorrect', id: selectedItem.id });
                    setErrorTracker(prev => ({
                        ...prev,
                        [currentQuestion.id]: prev[currentQuestion.id] + 1
                    }));
                    setTimeout(nextStep, 1200);
                }
            };

            const getResultsColumns = () => {
                const mastered = []; 
                const learning = []; 
                const unknown = [];  
                vocabulary.forEach(word => {
                    const errors = errorTracker[word.id];
                    if (errors === 0) mastered.push(word);
                    else if (errors === 1) learning.push(word);
                    else unknown.push(word);
                });
                return { mastered, learning, unknown };
            };

            if (view === 'menu') {
                return (
                    <div className="min-h-screen bg-red-50 flex flex-col items-center justify-center p-4 font-sans text-slate-800">
                        <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center border-4 border-red-300">
                            <div className="text-6xl mb-4">🎧</div>
                            <h1 className="text-4xl font-bold text-red-600 mb-2 tracking-tight">{THEME.name}</h1>
                            <p className="text-gray-500 mb-8 font-medium italic">Quiz de vocabulaire</p>
                            <div className="space-y-4">
                                <button onClick={() => setView('learn')} className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 text-xl shadow-md transition-all active:scale-95">
                                    <BookOpen /> Learn
                                </button>
                                <button onClick={startQuiz} className="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 text-xl shadow-md transition-all active:scale-95">
                                    <Play /> Play Game
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'learn') {
                return (
                    <div className="min-h-screen bg-green-50 flex flex-col items-center p-4">
                        <div className="w-full max-w-lg flex justify-between items-center mb-6">
                            <button onClick={() => setView('menu')} className="bg-white p-2 rounded-full shadow text-gray-600 flex items-center justify-center w-10 h-10"><Home /></button>
                            <h2 className="text-2xl font-bold text-green-700 uppercase tracking-wide">Vocabulary</h2>
                            <div className="w-10"></div>
                        </div>
                        <div className="grid grid-cols-2 gap-4 w-full max-w-lg">
                            {vocabulary.map((item) => (
                                <div key={item.id} onClick={() => speak(item.text)} className={`cursor-pointer ${item.color} border-b-4 p-4 rounded-3xl shadow-sm flex flex-col items-center justify-center transition-transform active:scale-95 h-36`}>
                                    <WordVisual item={item} className="h-24 object-contain pointer-events-none" />
                                </div>
                            ))}
                        </div>
                        <button onClick={() => setView('menu')} className="mt-12 bg-white px-8 py-3 rounded-full text-green-600 font-bold shadow-sm border border-green-200">Back</button>
                    </div>
                );
            }

            if (view === 'quiz') {
                const currentQuestion = quizQueue[currentQuestionIndex];
                return (
                    <div className="min-h-screen bg-orange-50 flex flex-col items-center p-4">
                        <div className="w-full max-w-lg flex justify-between items-center mb-4">
                            <button onClick={() => setView('menu')} className="bg-white p-2 rounded-full shadow text-gray-600 flex items-center justify-center w-10 h-10"><Home /></button>
                            <div className="bg-white px-4 py-1 rounded-full text-orange-600 font-bold shadow-sm">
                                 {currentQuestionIndex + 1} / {quizQueue.length}
                            </div>
                        </div>

                        <div className={`bg-white ${nbOptions > 4 ? "p-4 mb-4" : "p-8 mb-8"} rounded-3xl shadow-lg border-b-4 border-orange-200 w-full max-w-lg text-center`}>
                            <button onClick={() => speak(currentQuestion.text)} className="bg-orange-500 text-white p-6 rounded-full shadow-lg mb-2 transform hover:scale-105 transition-transform active:scale-90 flex items-center justify-center mx-auto">
                                <Volume2 size={48} />
                            </button>
                            <p className="text-gray-400 text-xs mt-2 font-bold uppercase tracking-widest">Listen</p>
                        </div>

                        <div className={`grid ${optionsLayout.cols} gap-3 w-full ${optionsLayout.wrap} pb-8`}>
                            {currentOptions.map((item) => {
                                const isSelected = feedback?.id === item.id;
                                const status = isSelected ? feedback.status : '';
                                
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => handleAnswer(item)}
                                        disabled={feedback !== null}
                                        className={`${optionsLayout.card} rounded-3xl shadow-md border-b-4 transition-all flex items-center justify-center bg-white border-gray-200 active:scale-95 
                                        ${status === 'correct' ? '!bg-green-400 !border-green-600 !scale-105' : ''} 
                                        ${status === 'incorrect' ? '!bg-red-400 !border-red-600' : ''}
                                        ${feedback !== null && !isSelected ? 'opacity-40' : ''}`}
                                    >
                                        <WordVisual item={item} className={`${optionsLayout.img} object-contain pointer-events-none`} />
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            if (view === 'results') {
                const { mastered, learning, unknown } = getResultsColumns();
                return (
                    <div className="min-h-screen bg-indigo-50 flex flex-col items-center p-4 text-slate-800">
                        <h1 className="text-3xl font-black text-indigo-700 mt-4 mb-8 uppercase text-center tracking-tighter">My Results</h1>
                        
                        <div className="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
                            <div className="bg-white p-5 rounded-3xl shadow border-t-8 border-red-500">
                                <div className="flex items-center gap-3 mb-6 text-red-600 font-bold uppercase text-[12px] tracking-wide">
                                    <XCircle /> <span>Je ne sais pas encore</span>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    {unknown.map(item => (
                                        <button 
                                            key={item.id} 
                                            onClick={() => speak(item.text)}
                                            className="flex flex-col items-center p-4 bg-red-50 rounded-2xl hover:bg-red-100 transition-colors"
                                        >
                                            <WordVisual item={item} className="h-16 object-contain pointer-events-none" />
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-3xl shadow border-t-8 border-orange-500">
                                <div className="flex items-center gap-3 mb-6 text-orange-600 font-bold uppercase text-[12px] tracking-wide">
                                    <HelpCircle /> <span>Je commence à savoir</span>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    {learning.map(item => (
                                        <button 
                                            key={item.id} 
                                            onClick={() => speak(item.text)}
                                            className="flex flex-col items-center p-4 bg-orange-50 rounded-2xl hover:bg-orange-100 transition-colors"
                                        >
                                            <WordVisual item={item} className="h-16 object-contain pointer-events-none" />
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white p-5 rounded-3xl shadow border-t-8 border-green-500">
                                <div className="flex items-center gap-3 mb-6 text-green-600 font-bold uppercase text-[12px] tracking-wide">
                                    <CheckCircle /> <span>Je sais !</span>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    {mastered.map(item => (
                                        <button 
                                            key={item.id} 
                                            onClick={() => speak(item.text)}
                                            className="flex flex-col items-center p-4 bg-green-50 rounded-2xl hover:bg-green-100 transition-colors"
                                        >
                                            <WordVisual item={item} className="h-16 object-contain pointer-events-none" />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                        
                        <button onClick={() => setView('menu')} className="bg-indigo-600 text-white font-black py-4 px-12 rounded-2xl shadow-xl flex items-center gap-3 transition-transform active:scale-95">
                            <RefreshCw /> REPLAY
                        </button>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FoodApp />);
    </script>
</body>
</html>
